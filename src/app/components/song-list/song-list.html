<div class="song-list-container">
  <h2 class="page-title">All Songs</h2>
  
  <div class="songs-grid">
    <mat-card *ngFor="let song of songs" class="song-card">
      <img 
        mat-card-image 
        [src]="song.coverImageUrl" 
        [alt]="song.title"
        class="song-cover"
      />
      
      <mat-card-header>
        <mat-card-title>{{ song.title }}</mat-card-title>
        <mat-card-subtitle>{{ getArtistName(song.artistId) }}</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="song-info">
          <mat-chip-set>
            <mat-chip>{{ song.genre }}</mat-chip>
          </mat-chip-set>
          <p class="duration">{{ song.getFormattedDuration() }}</p>
        </div>
      </mat-card-content>
      
      <mat-card-actions class="song-actions">
        <button 
          mat-raised-button 
          color="primary" 
          (click)="playSong(song)"
        >
          <mat-icon>play_arrow</mat-icon>
          Play
        </button>
        
        <button 
          mat-icon-button 
          (click)="toggleFavorite(song)"
          [ngClass]="{'favorite-active': song.isFavorite}"
        >
          <mat-icon>{{ song.isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
        </button>
        
        <button 
          mat-icon-button 
          (click)="addToPlaylist(song)"
        >
          <mat-icon>playlist_add</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
